
#!/bin/bash
# =============================================================================
# k200_idle_sleep.conf — K200 空闲休眠开关 (第28章实现, 默认全部关闭)
#   由 idle_sleep.sh 读取; 也可以被 cron 里 source。
#   全默认关闭: K200_IDLE_SLEEP_MIN=0 => idle_sleep.sh 直接退出, 零行为。
# =============================================================================
# 0 = 关闭(默认)。>0 = 空闲 N 分钟后执行休眠动作。
K200_IDLE_SLEEP_MIN=0
# 休眠层级: L1 = 停服务(网关+引擎), 保留 kunlun 驱动在线。
#   (L2/L3 见 PROGRESS 第28章: 驱动无 PM 回调、PME 全状态关闭 => 当前不具备条件)
K200_IDLE_SLEEP_LEVEL=L1
# 1 = 只停引擎/网关, 不动驱动与 PCI(安全, 默认)
K200_IDLE_SLEEP_KEEP_DRIVER=1
# 空闲判据来源: /health 的 requests 计数在 N 分钟内不变 => 空闲
K200_IDLE_SLEEP_SRC=http://127.0.0.1:8090/health
# 停机期间写标记文件; 有该标记时不应让 svc_guard 自动拉起(见 README 的 svc_guard 补丁)
K200_IDLE_SLEEP_MARKER=/home/caden/ornc/.idle_asleep
# 日志
K200_IDLE_SLEEP_LOG=/home/caden/ornc/idle_sleep.log
